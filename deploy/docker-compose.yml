# Lute VPS stack: a real Graph Node (graph-node + postgres + ipfs) plus the Lute app.
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d
#
# graph-node INDEXES by calling a Base RPC (it does not run a Base node), so this is
# light — a 2-4 GB VPS is plenty for the fixed historical range used here.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements", "-cmax_connections=200"]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-let-me-in}
      POSTGRES_DB: graph-node
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ipfs:
    image: ipfs/kubo:v0.34.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ipfs-data:/data/ipfs

  graph-node:
    image: graphprotocol/graph-node:v0.37.0
    restart: unless-stopped
    depends_on:
      - postgres
      - ipfs
    # Bound to localhost only — the admin/deploy API (8020) must never be public.
    # GRAPH_QUERY_PORT lets you move the host-side query port off a taken 8000.
    ports:
      - "127.0.0.1:${GRAPH_QUERY_PORT:-8000}:8000" # GraphQL (query)
      - "127.0.0.1:8020:8020" # JSON-RPC (deploy)
      - "127.0.0.1:8030:8030" # subgraph indexing status
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: ${POSTGRES_PASSWORD:-let-me-in}
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      # chain name "base" must match `network: base` in subgraph.yaml
      ethereum: "base:${GRAPH_ETH_RPC:-https://mainnet.base.org}"
      GRAPH_LOG: info
      ETHEREUM_REORG_THRESHOLD: "16"

  lute:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - graph-node
    ports:
      - "127.0.0.1:8788:8788" # dashboard (localhost only; SSH-tunnel to view)
    volumes:
      - lute-runs:/app/.lute
    environment:
      BASE_RPC_VERIFIER: ${BASE_RPC_VERIFIER:-https://mainnet.base.org}
      GRAPH_NODE_URL: http://graph-node:8000
      PORT: "8788"

  lute-paid:
    profiles: ["paid"]
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - graph-node
    env_file:
      - .env
    ports:
      - "127.0.0.1:8793:8793"
    volumes:
      - lute-runs:/app/.lute
    environment:
      BASE_RPC_VERIFIER: ${BASE_RPC_VERIFIER:-https://mainnet.base.org}
      GRAPH_NODE_URL: http://graph-node:8000
      PAID_PORT: "8793"
      PAID_PUBLIC_URL: ${PAID_PUBLIC_URL:-https://uselute.xyz}

volumes:
  postgres-data:
  ipfs-data:
  lute-runs:
